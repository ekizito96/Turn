name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  providers:
    name: Provider drivers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: providers

      - name: Check TypeSafe driver format
        run: cargo fmt -p turn-provider-typesafe -- --check
        working-directory: providers

      - name: Test providers
        run: cargo test --workspace
        working-directory: providers

      - name: Build WASM providers
        run: cargo build --workspace --release --target wasm32-unknown-unknown
        working-directory: providers

      - name: Verify provider artifacts
        run: |
          for name in anthropic azure_anthropic azure_openai azure_openai_responses gemini grok ollama openai typesafe; do
            test -s "providers/target/wasm32-unknown-unknown/release/turn_provider_${name}.wasm"
            test -s "impl/assets/${name}_provider.wasm"
          done

      - name: Load bundled providers
        run: cargo test --manifest-path impl/Cargo.toml --lib bundled_official_providers_are_valid_wasm_modules

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check format
        run: cargo fmt --all -- --check
        working-directory: impl

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: impl

      - name: Test
        run: cargo test
        working-directory: impl

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release
        working-directory: impl

  hello:
    name: Run hello_turn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and run hello_turn
        run: cargo run --quiet -- run tests/hello_turn.tn
        working-directory: impl
